name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # History signals need more than the default single commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # A ratchet, not a quality bar: the number sits just above the current
      # score so a real regression fails the build. Raise it only alongside a
      # note saying what got worse and why that is acceptable.
      - name: Scan unvibe-cli with unvibe-cli
        run: node dist/cli.js scan . --max-slop 52
      - name: Upload SARIF
        run: node dist/cli.js scan . --format sarif -o unvibe.sarif
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: unvibe.sarif
