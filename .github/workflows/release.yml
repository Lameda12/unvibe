name: Release

# Tag-driven on purpose. The changesets "Version Packages" PR flow needs
# GitHub Actions to be allowed to open pull requests, which is off by default
# and org-controlled. Tagging needs no special permission and makes the moment
# of publishing explicit.
#
# To cut a release:
#   npm run version      # changeset version: bumps package.json + CHANGELOG
#   git commit -am "Release vX.Y.Z" && git push
#   git tag vX.Y.Z && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run ci

      - name: Refuse to publish a version the tag does not match
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $packaged." >&2
            echo "Run 'npm run version', commit the bump, then tag it." >&2
            exit 1
          fi
          echo "Publishing $(node -p "require('./package.json').name")@$packaged"

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
